name: Fix lip crayon ending

on:
  push:
    paths:
      - ".github/workflows/fix-lip-crayon-ending.yml"

permissions:
  contents: write

jobs:
  fix-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Extend and soften lip crayon ending
        shell: bash
        run: |
          set -euo pipefail
          INPUT="assets/portfolio/video/merythod-lip-crayon-9x16.mp4"
          OUTPUT="assets/portfolio/video/merythod-lip-crayon-9x16.fixed.mp4"

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$INPUT")
          AUDIO_FADE_START=$(awk -v d="$DURATION" 'BEGIN { x=d-0.45; if (x<0) x=0; printf "%.3f", x }')
          VIDEO_FADE_START=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d+0.70 }')

          ffmpeg -y -hide_banner -loglevel error -i "$INPUT"             -filter_complex "[0:v]tpad=stop_mode=clone:stop_duration=1.0,fade=t=out:st=${VIDEO_FADE_START}:d=0.30[v];[0:a]afade=t=out:st=${AUDIO_FADE_START}:d=0.45,apad=pad_dur=1.0[a]"             -map "[v]" -map "[a]"             -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p             -c:a aac -b:a 160k -movflags +faststart -shortest "$OUTPUT"

          mv "$OUTPUT" "$INPUT"

      - name: Correct displayed duration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("portfolio.html")
          s = p.read_text(encoding="utf-8")
          needle = 'data-video="assets/portfolio/video/merythod-lip-crayon-9x16.mp4"'
          start = s.index(needle)
          end = s.index("</button>", start)
          block = s[start:end]
          import re
          block = re.sub(r'<span class="video-duration">[^<]+</span>',
                         '<span class="video-duration">00:18</span>',
                         block, count=1)
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio/video/merythod-lip-crayon-9x16.mp4 portfolio.html
          git commit -m "Polish lip crayon video ending"
          git push
